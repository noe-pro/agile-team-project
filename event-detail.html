<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Détail de l'événement</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .status { font-weight: bold; }
    button { margin-top: 16px; padding: 10px 18px; }
    .confirmation { margin-top: 12px; padding: 8px; background: #e8f5e9; color: #1b5e20; }
  </style>
</head>
<body>
  <!-- CCG2-6 / US03 : s'inscrire à un événement -->
  <p><a href="events.html">← Retour aux événements</a></p>
  <main id="event">
    <h1 id="event-title"></h1>
    <p id="event-meta"></p>
    <p id="event-description"></p>
    <p>Statut : <span id="event-status" class="status"></span></p>
    <button type="button" id="register-button"></button>
    <p id="confirmation" class="confirmation" role="status" hidden></p>
  </main>
  <p id="not-found" hidden>Événement introuvable.</p>

  <script>
    const STORAGE_KEY = "campusconnect.events";
    let events = [];
    try { events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { events = []; }

    const id = new URLSearchParams(location.search).get("id");
    const current = events.find(e => e.id === id) || (id ? null : events[0]);

    if (!current) {
      document.getElementById("event").hidden = true;
      document.getElementById("not-found").hidden = false;
    } else {
      document.getElementById("event-title").textContent = current.title;
      document.getElementById("event-meta").textContent =
        new Date(current.date + "T00:00").toLocaleDateString("fr-FR") +
        (current.time ? " à " + current.time : "") + " — " + current.location;
      document.getElementById("event-description").textContent = current.description;
      render();
    }

    function render() {
      document.getElementById("event-status").textContent = current.registered ? "Inscrit" : "Non inscrit";
      document.getElementById("register-button").textContent =
        current.registered ? "Annuler mon inscription" : "S'inscrire";
    }

    document.getElementById("register-button").addEventListener("click", function () {
      current.registered = !current.registered;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      render();
      const confirmation = document.getElementById("confirmation");
      confirmation.textContent = current.registered
        ? "Votre inscription à « " + current.title + " » est confirmée."
        : "Votre inscription a été annulée.";
      confirmation.hidden = false;
    });
  </script>
</body>
</html>
